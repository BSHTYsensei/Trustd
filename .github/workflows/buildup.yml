name: LegacyLiquidGlass V2 AI Builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: "V2 upgrade request"
        required: true
        default: "Build complete LegacyLiquidGlass V2 framework"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: pip install --quiet openai

      - name: Collect Swift Files
        run: |
          mkdir -p context
          find . -name "*.swift" -not -path "./.git/*" -print > context/swift_files.txt
          echo "Found $(wc -l < context/swift_files.txt) swift files"

      - name: Create AI Generator
        run: |
          cat > ai_generator.py <<'PY'
          import os
          import re
          import sys
          from openai import OpenAI

          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

          source = ""
          manifest = "context/swift_files.txt"
          if os.path.exists(manifest):
              with open(manifest, encoding="utf-8") as f:
                  for line in f:
                      path = line.strip()
                      if not path or not os.path.exists(path):
                          continue
                      try:
                          with open(path, encoding="utf-8", errors="ignore") as code:
                              source += "\n\nFILE:\n" + path + "\n" + code.read()
                      except Exception as e:
                          print("skip " + path + ": " + str(e), file=sys.stderr)

          MAX_CHARS = 400000
          if len(source) > MAX_CHARS:
              source = source[:MAX_CHARS] + "\n\n// [truncated]\n"

          prompt = (
              "You are the lead engineer of an Apple graphics framework.\n\n"
              "Create a single file named: LegacyLiquidGlassV2.swift\n\n"
              "Before coding, analyze public information about:\n"
              "- Apple Liquid Glass, GlassEffectContainer, UIGlassEffect\n"
              "- Metal rendering, GPU blur pipeline, backdrop texture sampling\n"
              "- Refraction shader, Fresnel lighting, SDF morphing\n\n"
              "Do NOT use private APIs. Target iOS 13 - iOS 26+.\n\n"
              "Architecture:\n"
              "1. Runtime Core: version detection, backend selector, configuration, device capability\n"
              "2. Rendering Engine: Metal device, command queue, texture cache, backdrop capture,\n"
              "   blur pipeline, refraction, distortion, Fresnel, specular reflection, tint adaptation\n"
              "3. Material System: regular / clear / prominent / tinted glass with thickness,\n"
              "   transmission, roughness, refraction index, specular\n"
              "4. Liquid Morph: SDF, smooth union, shape blending, container fusion\n"
              "5. Interaction: touch field, velocity, spring animation, highlight movement\n"
              "6. Performance: FPS monitor, thermal state, quality scaling, texture reuse, device profiles\n"
              "7. Components:\n"
              "   UIKit: LLGlassView, LLGlassButton, LLGlassToolbar, LLGlassNavigationBar, LLGlassTabBar, LLGlassSheet\n"
              "   SwiftUI: .llGlass(), .llGlassContainer(), .llGlassButton()\n\n"
              "Requirements: Swift 5.9+, iOS 13+, UIKit, SwiftUI, Metal, ARC safe, thread safe.\n"
              "No placeholders. No TODOs.\n\n"
              "Output rules:\n"
              "- Return ONLY Swift source code.\n"
              "- No markdown fences.\n"
              "- No explanations.\n\n"
              "Existing source:\n" + source
          )

          result = client.responses.create(model="gpt-5", input=prompt)
          text = (result.output_text or "").strip()

          m = re.match(r"^```(?:swift)?\s*\n(.*)\n```\s*$", text, re.DOTALL)
          if m:
              text = m.group(1).strip()

          if not text:
              print("ERROR: model returned empty output", file=sys.stderr)
              sys.exit(1)

          with open("LegacyLiquidGlassV2.swift", "w", encoding="utf-8") as out:
              out.write(text)

          print("Generated LegacyLiquidGlassV2.swift (" + str(len(text)) + " chars)")
          PY

      - name: Run AI Generator
        env:
          OPENAI_API_KEY: ${{ secrets.iOS }}
        run: python3 ai_generator.py

      - name: Swift Syntax Check
        run: |
          if [ ! -s LegacyLiquidGlassV2.swift ]; then
            echo "::error::Generated file is empty"
            exit 1
          fi
          swiftc -frontend -parse LegacyLiquidGlassV2.swift

      - name: Upload Generated File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegacyLiquidGlassV2
          path: LegacyLiquidGlassV2.swift
          if-no-files-found: warn
