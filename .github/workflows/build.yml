name: Hoshino iOS Build

on:
  push:
    paths:
      - 'Hoshino.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IOS_SDK_NAME: iPhoneOS16.5.sdk

    steps:
      - name: Checkout Hoshino repository
        uses: actions/checkout@v4

      - name: Checkout Theos iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: theos-sdks
          sparse-checkout: |
            iPhoneOS16.5.sdk
          sparse-checkout-cone-mode: true

      - name: Select Xcode and extract Hoshino.zip
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || {
            echo "Xcode 16.4 was not found at: $DEVELOPER_DIR" >&2
            ls -1 /Applications | grep -E '^Xcode.*\.app$' || true
            exit 1
          }
          sudo -n xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          test -s "$GITHUB_WORKSPACE/Hoshino.zip" || {
            echo "Hoshino.zip is missing or empty in the repository root." >&2
            exit 1
          }
          SOURCE_DIR="$RUNNER_TEMP/Hoshino-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$GITHUB_WORKSPACE/Hoshino.zip" -d "$SOURCE_DIR"
          test -d "$SOURCE_DIR/Hoshino.xcodeproj" || {
            echo "Hoshino.xcodeproj was not found at the root of Hoshino.zip." >&2
            find "$SOURCE_DIR" -maxdepth 3 -name '*.xcodeproj' -print
            exit 1
          }
          echo "HOSHINO_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Hoshino source extracted to: $SOURCE_DIR"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid libarchive pkgconf
          LIBARCHIVE_PREFIX="$(brew --prefix libarchive)"
          echo "PKG_CONFIG_PATH=$LIBARCHIVE_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$LIBARCHIVE_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$LIBARCHIVE_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix)/bin:$PATH" >> "$GITHUB_ENV"
          command -v ldid
          ldid -h >/dev/null 2>&1 || true
          if [[ -f "$LIBARCHIVE_PREFIX/lib/pkgconfig/libarchive.pc" ]]; then
            echo "libarchive.pc found: $LIBARCHIVE_PREFIX/lib/pkgconfig/libarchive.pc"
          else
            echo "libarchive.pc is absent; Makefile's optional host ArchiveCore test will be skipped."
          fi

      - name: Run host smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOSHINO_SOURCE_DIR"
          sudo -n -E env "PATH=$PATH" "DEVELOPER_DIR=$DEVELOPER_DIR" \
            "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}" make smoke
          sudo -n chown -R "$(id -u):$(id -g)" build 2>/dev/null || true

      - name: Install and register Theos iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_SOURCE="$GITHUB_WORKSPACE/theos-sdks/iPhoneOS16.5.sdk"
          PLATFORM_DIR="$DEVELOPER_DIR/Platforms/iPhoneOS.platform"
          PLATFORM_INFO="$PLATFORM_DIR/Info.plist"
          SDK_DEST="$PLATFORM_DIR/Developer/SDKs/iPhoneOS16.5.sdk"
          BACKUP="$RUNNER_TEMP/Hoshino-iPhoneOS-platform-Info.plist.backup"
          MARKER="$RUNNER_TEMP/Hoshino-managed-ios165-sdk.marker"

          test -d "$SDK_SOURCE" || { echo "Theos iPhoneOS16.5.sdk checkout is missing." >&2; exit 1; }
          test -f "$SDK_SOURCE/SDKSettings.plist" || { echo "SDKSettings.plist is missing from Theos SDK." >&2; exit 1; }
          test -f "$PLATFORM_INFO" || { echo "Xcode iPhoneOS.platform/Info.plist is missing." >&2; exit 1; }
          test ! -e "$SDK_DEST" || {
            echo "Refusing to overwrite an existing SDK: $SDK_DEST" >&2
            exit 1
          }

          ORIGINAL_MINIMUM="$(/usr/libexec/PlistBuddy -c 'Print :MinimumSDKVersion' "$PLATFORM_INFO")"
          echo "Original iPhoneOS platform MinimumSDKVersion: $ORIGINAL_MINIMUM"
          sudo -n cp -p "$PLATFORM_INFO" "$BACKUP"
          touch "$MARKER"

          sudo -n mkdir -p "$(dirname "$SDK_DEST")"
          sudo -n ditto "$SDK_SOURCE" "$SDK_DEST"

          # The Theos directory is named iPhoneOS16.5.sdk, but Xcode 16.4
          # reports the SDK's embedded version as 16.4. Lower the platform's
          # discovery minimum to that embedded version so DVTSDK will not skip it.
          python3 - "$PLATFORM_INFO" "$RUNNER_TEMP/Hoshino-patched-platform-Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          with source.open("rb") as stream:
              data = plistlib.load(stream)
          old = data.get("MinimumSDKVersion")
          if isinstance(old, str):
              data["MinimumSDKVersion"] = "16.4"
          elif isinstance(old, (int, float)) and not isinstance(old, bool):
              data["MinimumSDKVersion"] = 16.4
          else:
              raise SystemExit(f"Unexpected MinimumSDKVersion value: {old!r}")
          with destination.open("wb") as stream:
              plistlib.dump(data, stream, fmt=plistlib.FMT_XML, sort_keys=False)
          print(f"Prepared temporary MinimumSDKVersion patch: {old!r} -> {data['MinimumSDKVersion']!r}")
          PY
          sudo -n cp "$RUNNER_TEMP/Hoshino-patched-platform-Info.plist" "$PLATFORM_INFO"

          PATCHED_MINIMUM="$(/usr/libexec/PlistBuddy -c 'Print :MinimumSDKVersion' "$PLATFORM_INFO")"
          echo "Patched iPhoneOS platform MinimumSDKVersion: $PATCHED_MINIMUM"
          test "$PATCHED_MINIMUM" = "16.4" || {
            echo "Xcode platform minimum was not changed to 16.4." >&2
            exit 1
          }
          sudo -n plutil -lint "$PLATFORM_INFO"

          SDK_INTERNAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :Version' "$SDK_DEST/SDKSettings.plist" 2>/dev/null || true)"
          echo "Theos SDK directory: $SDK_DEST"
          echo "Theos SDK embedded Version: ${SDK_INTERNAL_VERSION:-not exposed by SDKSettings.plist}"
          RESOLVED_SDK="$(xcrun --sdk iphoneos16.5 --show-sdk-path)"
          echo "xcrun resolved SDK: $RESOLVED_SDK"
          test "$RESOLVED_SDK" = "$SDK_DEST" || {
            echo "xcrun did not resolve the Theos iPhoneOS16.5.sdk directory." >&2
            exit 1
          }

      - name: Build TrollStore IPA with iPhoneOS16.5.sdk
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOSHINO_SOURCE_DIR"
          BUILD_LOG="$RUNNER_TEMP/Hoshino-xcodebuild.log"
          echo "Building with SDK name: iphoneos16.5"
          echo "SDK path: $DEVELOPER_DIR/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS16.5.sdk"
          if make ipa SDK=iphoneos16.5 2>&1 | tee "$BUILD_LOG"; then
            test -s build/Hoshino.ipa
            echo "IPA created: $HOSHINO_SOURCE_DIR/build/Hoshino.ipa"
          else
            BUILD_STATUS=${PIPESTATUS[0]}
            echo "::error::Hoshino build failed with exit code $BUILD_STATUS"
            echo "----- Last 200 lines of xcodebuild/make output -----"
            tail -n 200 "$BUILD_LOG" || true
            exit "$BUILD_STATUS"
          fi

      - name: Upload Hoshino IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hoshino-iOS16.5-TrollStore
          path: ${{ runner.temp }}/Hoshino-source/build/Hoshino.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Restore Xcode platform and remove temporary SDK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_DIR="$DEVELOPER_DIR/Platforms/iPhoneOS.platform"
          PLATFORM_INFO="$PLATFORM_DIR/Info.plist"
          SDK_DEST="$PLATFORM_DIR/Developer/SDKs/iPhoneOS16.5.sdk"
          BACKUP="$RUNNER_TEMP/Hoshino-iPhoneOS-platform-Info.plist.backup"
          MARKER="$RUNNER_TEMP/Hoshino-managed-ios165-sdk.marker"

          if [[ -f "$BACKUP" ]]; then
            sudo -n cp -p "$BACKUP" "$PLATFORM_INFO"
            sudo -n plutil -lint "$PLATFORM_INFO"
            RESTORED_MINIMUM="$(/usr/libexec/PlistBuddy -c 'Print :MinimumSDKVersion' "$PLATFORM_INFO")"
            echo "Restored original iPhoneOS platform MinimumSDKVersion: $RESTORED_MINIMUM"
          else
            echo "No Xcode platform backup was created; nothing to restore."
          fi

          if [[ -f "$MARKER" ]]; then
            sudo -n rm -rf "$SDK_DEST"
            rm -f "$MARKER"
            echo "Removed temporary Theos SDK registration."
          fi
