name: Build TrollStore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root

      - name: Setup app bundle structure
        run: |
          mkdir -p Payload/TrollStore.app
          cp build_root/TrollStore/CodeSigningInstaller.swift build_root/TrollStore/AppListView.swift build_root/TrollStore/SettingsView.swift build_root/TrollStore/AppManager.swift Payload/TrollStore.app/
          cp build_root/TrollStore/trollstorehelper Payload/TrollStore.app/
          cp build_root/TrollStore/ldid Payload/TrollStore.app/
          cp build_root/TrollStore/TrollHelper Payload/TrollStore.app/ 2>/dev/null || true
          cp build_root/TrollStore/Resources/Info.plist Payload/TrollStore.app/
          cp build_root/TrollStore/Resources/entitlements.plist Payload/TrollStore.app/
          find build_root/TrollStore/Resources -maxdepth 1 \( -name "*.png" -o -name "*.jpg" \) -exec cp {} Payload/TrollStore.app/ \;

      - name: Compile Swift to TrollStore binary
        run: |
          cd Payload/TrollStore.app
          xcrun swiftc \
            -o TrollStore \
            CodeSigningInstaller.swift \
            AppListView.swift \
            SettingsView.swift \
            AppManager.swift \
            -target arm64-apple-ios15.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -framework UIKit \
            -framework SwiftUI \
            -framework Foundation \
            -framework CoreGraphics \
            -Xlinker -rpath -Xlinker @executable_path/ \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist
          chmod 755 TrollStore
          rm -f CodeSigningInstaller.swift AppListView.swift SettingsView.swift AppManager.swift

      - name: Sign all binaries with ldid
        run: |
          cd Payload/TrollStore.app
          chmod 755 ldid trollstorehelper TrollHelper
          ./ldid -Sentitlements.plist TrollStore
          ./ldid -Sentitlements.plist trollstorehelper
          ./ldid -Sentitlements.plist TrollHelper 2>/dev/null || true

      - name: Remove entitlements.plist from bundle
        run: |
          rm -f Payload/TrollStore.app/entitlements.plist

      - name: Package IPA
        run: |
          zip -r9 TrollStore.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.ipa
          path: TrollStore.ipa
