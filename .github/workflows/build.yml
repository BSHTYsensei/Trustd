name: Build TrollStore TAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Install deps
        run: |
          brew install libarchive openssl@3 pkg-config || true

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root
          find "$GITHUB_WORKSPACE/build_root" -maxdepth 4 -type d

      - name: Fetch RATreeView
        run: |
          git clone --depth 1 https://github.com/Augustyniak/RATreeView.git /tmp/RATreeView_src
          mkdir -p project_deps/RATreeView
          find /tmp/RATreeView_src -name "RATreeView*.h" -exec cp {} project_deps/RATreeView/ \;
          find /tmp/RATreeView_src -name "RATreeView*.m" -exec cp {} project_deps/RATreeView/ \;

      - name: Fetch ChOma and libarchive
        run: |
          git clone --depth 1 https://github.com/opa334/ChOma.git /tmp/ChOma_src
          git clone --depth 1 --branch v3.7.4 https://github.com/libarchive/libarchive.git /tmp/libarchive_src
          echo "=== ChOma src ==="
          ls -la /tmp/ChOma_src/src | head -n 40

      - name: Build fastPathSign
        id: build_fps
        continue-on-error: true
        run: |
          FPS_DIR=$(find "$GITHUB_WORKSPACE/build_root" -type d -name "fastPathSign" | head -n 1)
          [ -z "$FPS_DIR" ] && exit 1
          cd "$FPS_DIR"
          make -j$(sysctl -n hw.ncpu)
          FPS_BIN=$(find "$FPS_DIR" -type f -name "fastPathSign" ! -name "*.*" | head -n 1)
          [ -z "$FPS_BIN" ] && exit 1
          chmod 755 "$FPS_BIN"
          echo "FASTPATHSIGN_PATH=$FPS_BIN" >> $GITHUB_ENV

      - name: Build trollstorehelper
        id: build_helper
        continue-on-error: true
        run: |
          RH_DIR=$(find "$GITHUB_WORKSPACE/build_root" -type d -name "RootHelper" | head -n 1)
          [ -z "$RH_DIR" ] && exit 1
          RH_PARENT=$(dirname "$RH_DIR")
          echo "RH_DIR=$RH_DIR"

          FPS_DIR=$(find "$GITHUB_WORKSPACE/build_root" -type d -name "fastPathSign" | head -n 1)
          FPS_SRC="$FPS_DIR/src"
          [ -d "$FPS_SRC" ] || exit 1

          EXPLOITS_DIR=$(find "$GITHUB_WORKSPACE/build_root" -type d -name "Exploits" | head -n 1)
          if [ -n "$EXPLOITS_DIR" ] && [ "$(dirname "$EXPLOITS_DIR")" != "$RH_PARENT" ]; then
            cp -r "$EXPLOITS_DIR" "$RH_PARENT/Exploits"
          fi

          rm -rf "$RH_PARENT/ChOma"
          mkdir -p "$RH_PARENT/ChOma/src"
          mkdir -p "$RH_PARENT/ChOma/include"
          mkdir -p "$RH_PARENT/ChOma/external/ios"

          # ChOma 官方头文件先拷（保持大小写）
          cp -r /tmp/ChOma_src/src/*.h "$RH_PARENT/ChOma/src/"
          if [ -d /tmp/ChOma_src/include ]; then
            cp -r /tmp/ChOma_src/include/* "$RH_PARENT/ChOma/include/" 2>/dev/null || true
          fi

          # fastPathSign/src 只拷 .c/.m，不拷 .h
          for f in "$FPS_SRC"/*.c "$FPS_SRC"/*.m; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in main.c|main.m) continue ;; esac
            cp "$f" "$RH_PARENT/ChOma/src/"
          done

          # libcrypto.a / libssl.a
          cp /tmp/ChOma_src/external/ios/*.a "$RH_PARENT/ChOma/external/ios/" 2>/dev/null || true

          # libarchive 头文件
          cp "$(find /tmp/libarchive_src -name archive.h | head -n 1)" "$RH_DIR/"
          cp "$(find /tmp/libarchive_src -name archive_entry.h | head -n 1)" "$RH_DIR/"

          cd "$RH_DIR"
          sed -i '' 's|#include <archive.h>|#include "archive.h"|' unarchive.m || true
          sed -i '' 's|#include <archive_entry.h>|#include "archive_entry.h"|' unarchive.m || true

          cat > Makefile << 'EOF'
          TARGET := iphone:clang:16.5:14.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk

          TOOL_NAME = trollstorehelper

          trollstorehelper_FILES = main.m unarchive.m uicache.m jit.m devmode.m
          trollstorehelper_FILES += $(wildcard ../Shared/TSUtil.m)
          trollstorehelper_FILES += $(wildcard ../ChOma/src/*.c)
          trollstorehelper_FILES += $(wildcard ../ChOma/src/*.m)
          trollstorehelper_FILES += $(wildcard ../Exploits/fastPathSign/src/coretrust_bug.c)
          trollstorehelper_FILES += $(wildcard ../Exploits/fastPathSign/src/codesign.m)

          trollstorehelper_CFLAGS = -fobjc-arc -fmodules -Wno-everything -Wno-nonportable-include-path -I. -I../Shared -I../ChOma/include -I../ChOma/src -I../Exploits/fastPathSign/src -I$(shell brew --prefix)/opt/libarchive/include -I$(shell brew --prefix)/opt/openssl@3/include

          trollstorehelper_LDFLAGS = -L../ChOma/external/ios -lcrypto -larchive

          trollstorehelper_FRAMEWORKS = Foundation UIKit Security CoreFoundation CoreTelephony
          trollstorehelper_PRIVATE_FRAMEWORKS = SpringBoardServices BackBoardServices MobileContainerManager FrontBoardServices RunningBoardServices
          trollstorehelper_LIBRARIES = archive

          trollstorehelper_INSTALL_PATH = /usr/local/bin

          include $(THEOS_MAKE_PATH)/tool.mk
          EOF

          cat Makefile

          make -j$(sysctl -n hw.ncpu) FINALPACKAGE=1

          HELPER_PATH=$(find "$RH_DIR/.theos" -type f -name "trollstorehelper" ! -name "*.*" | head -n 1)
          if [ -z "$HELPER_PATH" ]; then
            echo "trollstorehelper not found"
            find "$RH_DIR/.theos" -type f | head -n 50
            exit 1
          fi
          cp "$HELPER_PATH" "$GITHUB_WORKSPACE/trollstorehelper_built"
          chmod 755 "$GITHUB_WORKSPACE/trollstorehelper_built"
          file "$GITHUB_WORKSPACE/trollstorehelper_built"

      - name: Sign trollstorehelper
        if: steps.build_helper.outcome == 'success' && steps.build_fps.outcome == 'success'
        run: |
          cp trollstorehelper_built trollstorehelper_to_sign
          if "$FASTPATHSIGN_PATH" trollstorehelper_to_sign 2>/dev/null; then
            mv trollstorehelper_to_sign trollstorehelper_built
          fi
          chmod 755 trollstorehelper_built

      - name: Fallback prebuilt
        if: steps.build_helper.outcome != 'success'
        run: |
          PREBUILT=$(find "$GITHUB_WORKSPACE/build_root" -type f -name "trollstorehelper" ! -name "*.*" | head -n 1)
          cp "$PREBUILT" trollstorehelper_built
          chmod 755 trollstorehelper_built

      - name: Upload helper
        if: steps.build_helper.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trollstorehelper
          path: trollstorehelper_built

      - name: Prepare Project
        if: steps.build_helper.outcome == 'success'
        run: |
          mkdir -p project/Resources
          cp build_root/TrollStore/CodeSigningInstaller.swift project/
          cp build_root/TrollStore/AppManager.swift project/
          cp build_root/TrollStore/SettingsView.swift project/
          cp build_root/TrollStore/AppListView.swift project/
          cp -r build_root/TrollStore/Resources/* project/Resources/
          cp build_root/TrollStore/ldid project/
          cp build_root/TrollStore/TrollHelper project/
          cp -r project_deps/RATreeView project/RATreeView
          echo '#import "RATreeView.h"' > project/Bridging.h

      - name: Makefile and Entry
        if: steps.build_helper.outcome == 'success'
        run: |
          cat << 'EOF' > project/Makefile
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESS = TrollStore
          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = TrollStore
          TrollStore_FILES = CodeSigningInstaller.swift AppManager.swift SettingsView.swift AppListView.swift TrollStoreApp.swift RATreeView/*.m
          TrollStore_FRAMEWORKS = UIKit SwiftUI Foundation CoreGraphics Security
          TrollStore_CFLAGS = -I./RATreeView
          TrollStore_RESOURCE_DIRS = Resources
          TrollStore_SWIFTFLAGS = -parse-as-library -import-objc-header ./Bridging.h
          include $(THEOS_MAKE_PATH)/application.mk
          EOF

          cat << 'EOF' > project/TrollStoreApp.swift
          import UIKit
          import SwiftUI

          @main
          class TrollStoreAppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let appListVC = AppListViewController()
                  let appListNav = UINavigationController(rootViewController: appListVC)
                  appListNav.tabBarItem = UITabBarItem(title: NSLocalizedString("Apps", comment: ""), image: UIImage(systemName: "app"), tag: 0)
                  let settingsVC = UIHostingController(rootView: SettingsView())
                  settingsVC.title = NSLocalizedString("Settings", comment: "")
                  let settingsNav = UINavigationController(rootViewController: settingsVC)
                  settingsNav.tabBarItem = UITabBarItem(title: NSLocalizedString("Settings", comment: ""), image: UIImage(systemName: "gear"), tag: 1)
                  let tabBarController = UITabBarController()
                  tabBarController.viewControllers = [appListNav, settingsNav]
                  window?.rootViewController = tabBarController
                  window?.makeKeyAndVisible()
                  return true
              }
              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey : Any] = [:]) -> Bool {
                  guard url.scheme == "apple-magnifier" else { return false }
                  guard let components = URLComponents(url: url, resolvingAgainstBaseURL: false) else { return false }
                  if components.host == "install" {
                      if let installURLString = components.queryItems?.first(where: { $0.name == "url" })?.value,
                         let installURL = URL(string: installURLString) {
                          DispatchQueue.main.async {
                              NotificationCenter.default.post(name: Notification.Name("TrollStoreRemoteInstall"), object: installURL)
                          }
                          return true
                      }
                  }
                  return false
              }
          }
          EOF

      - name: Build App
        if: steps.build_helper.outcome == 'success'
        run: |
          cd project
          make -j$(sysctl -n hw.ncpu)

      - name: Package TAR
        if: steps.build_helper.outcome == 'success'
        run: |
          cd project
          APP_PATH=$(find .theos -name "TrollStore.app" -type d | grep -v "_" | head -n 1)
          cp ../trollstorehelper_built "$APP_PATH/trollstorehelper"
          chmod 755 "$APP_PATH/trollstorehelper"
          cp ldid "$APP_PATH/ldid"
          cp TrollHelper "$APP_PATH/TrollHelper"
          chmod 755 "$APP_PATH/ldid" "$APP_PATH/TrollHelper"
          rm -f "$APP_PATH/entitlements.plist"
          tar -cvf ../TrollStore.tar -C $(dirname "$APP_PATH") TrollStore.app

      - name: Upload TAR
        if: steps.build_helper.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.tar
          path: TrollStore.tar
