name: Build TrollStore TAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Install deps
        run: |
          brew install libarchive openssl@3 pkg-config || true

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root
          find "$GITHUB_WORKSPACE/build_root" -maxdepth 4 -not -path "*__MACOSX*"

      - name: Fetch RATreeView
        run: |
          git clone --depth 1 https://github.com/Augustyniak/RATreeView.git /tmp/RATreeView_src
          mkdir -p project_deps/RATreeView
          find /tmp/RATreeView_src -name "*.h" -not -path "*Tests*" -not -path "*Example*" -exec cp {} project_deps/RATreeView/ \;
          find /tmp/RATreeView_src -name "*.m" -not -path "*Tests*" -not -path "*Example*" -exec cp {} project_deps/RATreeView/ \;
          echo "=== RATreeView files ==="
          ls -la project_deps/RATreeView

      - name: Prepare Project
        run: |
          mkdir -p project/Resources
          ROOT="$GITHUB_WORKSPACE/build_root"

          CS=$(find "$ROOT" -name "CodeSigningInstaller.swift" | head -n 1)
          AM=$(find "$ROOT" -name "AppManager.swift" | head -n 1)
          SV=$(find "$ROOT" -name "SettingsView.swift" | head -n 1)
          AL=$(find "$ROOT" -name "AppListView.swift" | head -n 1)
          RES=$(find "$ROOT" -type d -name "Resources" -not -path "*__MACOSX*" | head -n 1)
          LDID=$(find "$ROOT" -type f -name "ldid" ! -name "*.*" | head -n 1)
          TH=$(find "$ROOT" -type f -name "trollstorehelper" ! -name "*.*" | head -n 1)
          TSH=$(find "$ROOT" -type f -name "TrollHelper" ! -name "*.*" | head -n 1)

          [ -n "$CS" ] && cp "$CS" project/
          [ -n "$AM" ] && cp "$AM" project/
          [ -n "$SV" ] && cp "$SV" project/
          [ -n "$AL" ] && cp "$AL" project/
          [ -n "$RES" ] && cp -r "$RES"/* project/Resources/
          [ -n "$LDID" ] && cp "$LDID" project/ldid
          [ -n "$TH" ] && cp "$TH" project/trollstorehelper
          [ -n "$TSH" ] && cp "$TSH" project/TrollHelper

          chmod 755 project/ldid project/trollstorehelper project/TrollHelper 2>/dev/null || true

          cp project_deps/RATreeView/*.h project/
          cp project_deps/RATreeView/*.m project/

          cat > project/Bridging.h << 'EOF'
          #pragma clang diagnostic push
          #pragma clang diagnostic ignored "-Weverything"
          #import "RATreeView.h"
          #pragma clang diagnostic pop
          EOF

          echo "=== project contents ==="
          ls -la project

      - name: Create Makefile and Entry Point
        run: |
          cat << 'EOF' > project/Makefile
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESS = TrollStore
          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = TrollStore
          TrollStore_FILES = CodeSigningInstaller.swift AppManager.swift SettingsView.swift AppListView.swift TrollStoreApp.swift $(wildcard RA*.m)
          TrollStore_FRAMEWORKS = UIKit SwiftUI Foundation CoreGraphics Security
          TrollStore_CFLAGS = -fobjc-arc -Wno-error -Wno-everything
          TrollStore_OBJCFLAGS = -fobjc-arc -Wno-error -Wno-everything
          TrollStore_RESOURCE_DIRS = Resources
          TrollStore_SWIFTFLAGS = -parse-as-library -import-objc-header ./Bridging.h
          include $(THEOS_MAKE_PATH)/application.mk
          EOF

          cat << 'EOF' > project/TrollStoreApp.swift
          import UIKit
          import SwiftUI

          @main
          class TrollStoreAppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let appListVC = AppListViewController()
                  let appListNav = UINavigationController(rootViewController: appListVC)
                  appListNav.tabBarItem = UITabBarItem(title: NSLocalizedString("Apps", comment: ""), image: UIImage(systemName: "app"), tag: 0)
                  let settingsVC = UIHostingController(rootView: SettingsView())
                  settingsVC.title = NSLocalizedString("Settings", comment: "")
                  let settingsNav = UINavigationController(rootViewController: settingsVC)
                  settingsNav.tabBarItem = UITabBarItem(title: NSLocalizedString("Settings", comment: ""), image: UIImage(systemName: "gear"), tag: 1)
                  let tabBarController = UITabBarController()
                  tabBarController.viewControllers = [appListNav, settingsNav]
                  window?.rootViewController = tabBarController
                  window?.makeKeyAndVisible()
                  return true
              }
              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey : Any] = [:]) -> Bool {
                  guard url.scheme == "apple-magnifier" else { return false }
                  guard let components = URLComponents(url: url, resolvingAgainstBaseURL: false) else { return false }
                  if components.host == "install" {
                      if let installURLString = components.queryItems?.first(where: { $0.name == "url" })?.value,
                         let installURL = URL(string: installURLString) {
                          DispatchQueue.main.async {
                              NotificationCenter.default.post(name: Notification.Name("TrollStoreRemoteInstall"), object: installURL)
                          }
                          return true
                      }
                  }
                  return false
              }
          }
          EOF

      - name: Build App
        run: |
          cd project
          ls -la
          make -j$(sysctl -n hw.ncpu)

      - name: Package TAR
        run: |
          cd project
          APP_PATH=$(find .theos -name "TrollStore.app" -type d | grep -v "_" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "TrollStore.app not found"
            find .theos -type d
            exit 1
          fi
          cp trollstorehelper "$APP_PATH/trollstorehelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/trollstorehelper" 2>/dev/null || true
          cp ldid "$APP_PATH/ldid" 2>/dev/null || true
          cp TrollHelper "$APP_PATH/TrollHelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/ldid" "$APP_PATH/TrollHelper" 2>/dev/null || true
          rm -f "$APP_PATH/entitlements.plist"
          ls -la "$APP_PATH"
          tar -cvf ../TrollStore.tar -C $(dirname "$APP_PATH") TrollStore.app

      - name: Upload TAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.tar
          path: TrollStore.tar
          if-no-files-found: warn
