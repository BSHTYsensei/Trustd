name: Build Santander IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Download iOS 16.5 SDK
      run: |
        curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz
        mv iPhoneOS16.5.sdk ${{ github.workspace }}/sdk
        echo "SDKROOT=${{ github.workspace }}/sdk" >> $GITHUB_ENV

    - name: Extract source
      run: |
        mkdir -p source
        unzip -q Santander-main.zip -d source
        rm -rf source/__MACOSX
        echo "SOURCE_DIR=$(find source -maxdepth 1 -type d -not -name '__MACOSX' | tail -n 1)" >> $GITHUB_ENV
        ls -la ${{ env.SOURCE_DIR }}

    - name: Download ArgumentParser 1.0.3
      run: |
        cd ${{ env.SOURCE_DIR }}
        curl -L -o ap.tar.gz https://github.com/apple/swift-argument-parser/archive/refs/tags/1.0.3.tar.gz
        tar -xzf ap.tar.gz
        ls -la swift-argument-parser-1.0.3/Sources/ArgumentParser/

    - name: Build ArgumentParser for iOS
      run: |
        cd ${{ env.SOURCE_DIR }}
        mkdir -p ap-build
        AP_DIR_ABS="$PWD/ap-build"
        AP_SRC="$PWD/swift-argument-parser-1.0.3/Sources/ArgumentParser"

        if [ ! -d "$AP_SRC" ]; then
          echo "❌ ArgumentParser 源码目录不存在"
          exit 1
        fi

        cd "$AP_SRC"

        SWIFT_FILES=()
        while IFS= read -r -d '' file; do
          SWIFT_FILES+=("$file")
        done < <(find . -name "*.swift" -print0)

        echo "找到 ${#SWIFT_FILES[@]} 个 .swift 文件"

        xcrun --sdk iphoneos swiftc \
          -target arm64-apple-ios14.0 \
          -sdk "$SDKROOT" \
          -emit-module -emit-library -static \
          -module-name ArgumentParser \
          -swift-version 5 -O \
          "${SWIFT_FILES[@]}" \
          -emit-module-path "$AP_DIR_ABS/ArgumentParser.swiftmodule" \
          -o "$AP_DIR_ABS/libArgumentParser.a"

        echo "✅ 编译产物:"
        ls -la "$AP_DIR_ABS/"
      env:
        SDKROOT: ${{ github.workspace }}/sdk

    - name: Build IPA
      run: |
        cd ${{ env.SOURCE_DIR }}
        ls -la ap-build/ || { echo "❌ ap-build 缺失"; exit 1; }
        make clean || true
        make ipa
      env:
        SDKROOT: ${{ github.workspace }}/sdk

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Santander-IPA
        path: ${{ env.SOURCE_DIR }}/build/AppSantander.ipa
        retention-days: 7
