name: Build TrollStore TAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Install deps
        run: |
          brew install libarchive openssl@3 pkg-config || true
          brew install ldid || true
          if ! command -v ldid >/dev/null 2>&1; then
            if [ -f "$THEOS/bin/ldid" ]; then
              sudo ln -sf "$THEOS/bin/ldid" /usr/local/bin/ldid
            fi
          fi
          which ldid || true
          ldid -v || true

      - name: Build libarchive for iOS arm64
        run: |
          cd /tmp
          curl -L -o libarchive.tar.gz https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz
          tar xzf libarchive.tar.gz
          cd libarchive-3.7.4
          SDK=$THEOS/sdks/iPhoneOS16.5.sdk
          ./configure \
            --host=arm64-apple-darwin \
            --disable-shared \
            --enable-static \
            --without-bz2lib \
            --without-lzma \
            --without-lzo2 \
            --without-lz4 \
            --without-zstd \
            --without-nettle \
            --without-openssl \
            --without-xml2 \
            --without-expat \
            --without-iconv \
            CC="$(xcrun --sdk macosx --find clang)" \
            CFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 -Wno-everything" \
            CPPFLAGS="-isysroot $SDK" \
            LDFLAGS="-arch arm64 -isysroot $SDK"
          make -j$(sysctl -n hw.ncpu)
          echo "=== libarchive.a ==="
          ls -la .libs/libarchive.a || ls -la libarchive.a
          cp .libs/libarchive.a /tmp/libarchive_ios.a 2>/dev/null || cp libarchive.a /tmp/libarchive_ios.a
          lipo -info /tmp/libarchive_ios.a || file /tmp/libarchive_ios.a

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root
          find "$GITHUB_WORKSPACE/build_root" -maxdepth 4 -not -path "*__MACOSX*"

      - name: Prepare Project
        run: |
          mkdir -p project/Resources
          ROOT="$GITHUB_WORKSPACE/build_root"
          REPO="$GITHUB_WORKSPACE"

          SWIFT_FILE=$(find "$ROOT" -name "TrollStore.modified.swift" -not -path "*__MACOSX*" | head -n 1)
          if [ -z "$SWIFT_FILE" ]; then
            SWIFT_FILE=$(find "$ROOT" -name "TrollStore.swift" -not -path "*__MACOSX*" | head -n 1)
          fi
          if [ -z "$SWIFT_FILE" ]; then
            SWIFT_FILE=$(find "$REPO" -maxdepth 2 -name "TrollStore.swift" -not -path "*/.git/*" | head -n 1)
          fi
          if [ -z "$SWIFT_FILE" ]; then
            echo "TrollStore.swift not found"
            exit 1
          fi
          echo "Swift file: $SWIFT_FILE"
          cp "$SWIFT_FILE" project/TrollStore.swift

          LEGACY=$(find "$ROOT" -name "LegacyLiquidGlass.swift" -not -path "*__MACOSX*" | head -n 1)
          if [ -n "$LEGACY" ]; then
            echo "Legacy file: $LEGACY"
            cp "$LEGACY" project/LegacyLiquidGlass.swift
          fi

          RES=$(find "$ROOT" -type d -name "Resources" -not -path "*__MACOSX*" | head -n 1)
          if [ -n "$RES" ]; then
            rsync -a --exclude='*.diff' --exclude='*.patch' --exclude='__MACOSX' --exclude='.DS_Store' "$RES"/ project/Resources/ 2>/dev/null || true
          fi
          if [ -d "$REPO/Resources" ]; then
            rsync -a --exclude='*.diff' --exclude='*.patch' --exclude='__MACOSX' --exclude='.DS_Store' "$REPO/Resources"/ project/Resources/ 2>/dev/null || true
          fi

          LOCALIZED_SRC=$(find "$ROOT" -maxdepth 2 -name "Localizable.strings" -not -path "*__MACOSX*" | head -n 1)
          if [ -n "$LOCALIZED_SRC" ]; then
            echo "Found Localizable.strings: $LOCALIZED_SRC"
            mkdir -p project/Resources/zh-Hans.lproj
            cp "$LOCALIZED_SRC" project/Resources/zh-Hans.lproj/Localizable.strings
          fi

          LDID=$(find "$ROOT" -type f -name "ldid" ! -name "*.*" -not -path "*__MACOSX*" | head -n 1)
          TH=$(find "$ROOT" -type f -name "trollstorehelper" ! -name "*.*" -not -path "*__MACOSX*" | head -n 1)
          TSH=$(find "$ROOT" -type f -name "TrollHelper" ! -name "*.*" -not -path "*__MACOSX*" | head -n 1)

          [ -z "$LDID" ] && [ -f "$REPO/ldid" ] && LDID="$REPO/ldid"
          [ -z "$TH" ] && [ -f "$REPO/trollstorehelper" ] && TH="$REPO/trollstorehelper"
          [ -z "$TSH" ] && [ -f "$REPO/TrollHelper" ] && TSH="$REPO/TrollHelper"

          [ -n "$LDID" ] && cp "$LDID" project/ldid
          [ -n "$TH" ] && cp "$TH" project/trollstorehelper
          [ -n "$TSH" ] && cp "$TSH" project/TrollHelper
          chmod 755 project/ldid project/trollstorehelper project/TrollHelper 2>/dev/null || true

          if [ ! -f project/Resources/Info.plist ]; then
            cat > project/Resources/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>TrollStore</string>
            <key>CFBundleIdentifier</key><string>com.example.TrollStore</string>
            <key>CFBundleName</key><string>TrollStore</string>
            <key>CFBundleDisplayName</key><string>TrollStore</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleLocalizations</key>
            <array>
              <string>en</string>
              <string>zh-Hans</string>
            </array>
          </dict>
          </plist>
          PLIST
          fi

          cp /tmp/libarchive_ios.a project/libarchive.a
          echo "----- project dir -----"
          ls -la project
          echo "----- Resources tree -----"
          find project/Resources -maxdepth 3 || true

      - name: Patch LegacyLiquidGlass API
        run: |
          FILE=project/LegacyLiquidGlass.swift
          if [ ! -f "$FILE" ]; then
            echo "LegacyLiquidGlass.swift not found, skipping"
            exit 0
          fi

          echo "----- before -----"
          grep -n "darkerSystemColorsStatus\|isDarkerSystemColorsEnabled" "$FILE" || true

          python3 - "$FILE" << 'PYEOF'
          import sys

          path = sys.argv[1]
          OLD = "= UIAccessibility.darkerSystemColorsStatus"
          NEW = "= UIAccessibility.isDarkerSystemColorsEnabled"

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          out = []
          changed = 0
          for line in lines:
              stripped = line.rstrip("\n").rstrip("\r")
              if stripped.endswith(OLD):
                  new_stripped = stripped[: -len(OLD)] + NEW
                  if line.endswith("\r\n"):
                      line = new_stripped + "\r\n"
                  elif line.endswith("\n"):
                      line = new_stripped + "\n"
                  else:
                      line = new_stripped
                  changed += 1
              out.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(out)

          print(f"Replaced {changed} line(s).")
          PYEOF

          echo "----- after -----"
          grep -n "darkerSystemColorsStatus\|isDarkerSystemColorsEnabled" "$FILE" || true

          cp "$FILE" "$GITHUB_WORKSPACE/LegacyLiquidGlass.swift"

      - name: Patch TrollStore.swift
        run: |
          FILE=project/TrollStore.swift
          if [ ! -f "$FILE" ]; then
            echo "TrollStore.swift not found, skipping"
            exit 0
          fi

          python3 - "$FILE" << 'PYEOF'
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          old1 = "private func executeHelperCommand(args: [String], completion: ((Bool) -> Void)? = nil) {\n        DispatchQueue.global(qos: .userInitiated).async { [weak self] in"
          new1 = "private func executeHelperCommand(args: [String], completion: ((Bool) -> Void)? = nil) {\n        DispatchQueue.global(qos: .userInitiated).async {"
          n1 = c.count(old1)
          c = c.replace(old1, new1)
          print(f"[OK] [weak self] removed: {n1}")

          old2 = "DispatchQueue.main.async {\n                    guard let self = self else { return }\n                    if ret != 0 {"
          new2 = "DispatchQueue.main.async {\n                    if ret != 0 {"
          n2 = c.count(old2)
          c = c.replace(old2, new2)
          print(f"[OK] guard1 removed: {n2}")

          old3 = "DispatchQueue.main.async {\n                    guard let self = self else { return }\n                    self.errorTitle = TSLocalized(\"Error\", comment: \"\")"
          new3 = "DispatchQueue.main.async {\n                    self.errorTitle = TSLocalized(\"Error\", comment: \"\")"
          n3 = c.count(old3)
          c = c.replace(old3, new3)
          print(f"[OK] guard2 removed: {n3}")

          old4 = "selected.tint = .systemBlue"
          new4 = "selected.style = .tinted(.systemBlue)"
          n4 = c.count(old4)
          c = c.replace(old4, new4)
          print(f"[OK] selected.tint replaced: {n4}")

          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          PYEOF

          echo "----- after grep -----"
          grep -n "selected.tint = .systemBlue\|selected.style = .tinted\|weak self\] in\|guard let self = self else { return }" "$FILE" | head -n 40 || true

          cp "$FILE" "$GITHUB_WORKSPACE/TrollStore.patched.swift"

      - name: Create Makefile
        run: |
          cat << 'EOF' > project/Makefile
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESS = TrollStore
          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = TrollStore
          TrollStore_FILES = TrollStore.swift LegacyLiquidGlass.swift
          TrollStore_FRAMEWORKS = UIKit SwiftUI Foundation CoreGraphics Security UniformTypeIdentifiers Metal MetalKit QuartzCore CoreVideo
          TrollStore_CFLAGS = -Wno-error -Wno-everything
          TrollStore_OBJCFLAGS = -Wno-error -Wno-everything
          TrollStore_LDFLAGS = libarchive.a -lz
          TrollStore_RESOURCE_DIRS = Resources
          TrollStore_SWIFTFLAGS = -parse-as-library
          include $(THEOS_MAKE_PATH)/application.mk
          EOF

      - name: Strip Scene Manifest
        run: |
          PLIST=project/Resources/Info.plist
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -n 60
          else
            echo "Warning: project/Resources/Info.plist not found, skipping."
          fi

      - name: Build App
        run: |
          cd project
          ls -la
          make -j$(sysctl -n hw.ncpu)

      - name: Package TAR
        run: |
          cd project
          APP_PATH=$(find .theos -name "TrollStore.app" -type d | grep -v "_" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "TrollStore.app not found"
            find .theos -type d
            exit 1
          fi
          cp trollstorehelper "$APP_PATH/trollstorehelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/trollstorehelper" 2>/dev/null || true
          cp ldid "$APP_PATH/ldid" 2>/dev/null || true
          cp TrollHelper "$APP_PATH/TrollHelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/ldid" "$APP_PATH/TrollHelper" 2>/dev/null || true
          rm -f "$APP_PATH/entitlements.plist"
          echo "----- final .app tree -----"
          find "$APP_PATH" -maxdepth 3
          tar -cvf ../TrollStore.tar -C $(dirname "$APP_PATH") TrollStore.app

      - name: Upload TAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.tar
          path: |
            TrollStore.tar
            LegacyLiquidGlass.swift
            TrollStore.patched.swift
          if-no-files-found: warn
