name: Hoshino iOS 16.5 Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hoshino.zip'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Hoshino.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: hoshino-ios165-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TrollStore IPA (iOS 16.5 SDK)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      THEOS: ${{ github.workspace }}/theos
      IOS_SDK_PATH: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
      SOURCE_DIR: ${{ github.workspace }}/Hoshino-src
      IPA_NAME: Hoshino-iOS16.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ ! -d "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 16.4 was not found on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Theos iOS 16.5 SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
          key: theos-sdk-iPhoneOS16.5-master-146e41f-v1

      - name: Install Theos iOS 16.5 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"

          if [[ ! -f "$IOS_SDK_PATH/SDKSettings.plist" ]]; then
            SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
            curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
              --output "$SDK_ARCHIVE"
            tar -tJf "$SDK_ARCHIVE" >/dev/null
            tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"
          fi

          test -f "$IOS_SDK_PATH/SDKSettings.plist"
          test -d "$IOS_SDK_PATH/System/Library/Frameworks"
          plutil -lint "$IOS_SDK_PATH/SDKSettings.plist"
          echo "Using SDK: $IOS_SDK_PATH"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew update
          brew install ldid libarchive pkg-config

          # libarchive is keg-only on Homebrew. Resolve its actual prefix
          # instead of assuming that pkg-config can discover it globally.
          LIBARCHIVE_PREFIX="$(brew --prefix libarchive)"
          LIBARCHIVE_PC="$(find "$LIBARCHIVE_PREFIX" -name libarchive.pc -type f -print -quit)"
          if [[ -z "$LIBARCHIVE_PC" ]]; then
            echo "::error::libarchive.pc was not found under $LIBARCHIVE_PREFIX"
            find "$LIBARCHIVE_PREFIX" -maxdepth 5 -type f | sort | head -200 || true
            brew info libarchive || true
            exit 1
          fi

          LIBARCHIVE_PC_DIR="$(dirname "$LIBARCHIVE_PC")"
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="$LIBARCHIVE_PC_DIR:$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I$LIBARCHIVE_PREFIX/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$LIBARCHIVE_PREFIX/lib ${LDFLAGS:-}"
          export PATH="$LIBARCHIVE_PREFIX/bin:$PATH"

          # Persist these values for make smoke and later build steps.
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CPPFLAGS=$CPPFLAGS"
            echo "LDFLAGS=$LDFLAGS"
            echo "$LIBARCHIVE_PREFIX/bin"
          } >> "$GITHUB_ENV"
          echo "$LIBARCHIVE_PREFIX/bin" >> "$GITHUB_PATH"

          command -v ldid
          ldid -h >/dev/null 2>&1 || true
          echo "libarchive prefix: $LIBARCHIVE_PREFIX"
          echo "libarchive.pc: $LIBARCHIVE_PC"
          pkg-config --modversion libarchive
          pkg-config --cflags --libs libarchive

      - name: Extract Hoshino.zip from repository root
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Hoshino.zip"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$GITHUB_WORKSPACE/Hoshino.zip" -d "$SOURCE_DIR"
          test -f "$SOURCE_DIR/Makefile"
          test -d "$SOURCE_DIR/Hoshino.xcodeproj"
          test -f "$SOURCE_DIR/Hoshino/Entitlements/TrollStore.entitlements"

      - name: Run host-side tests
        working-directory: ${{ github.workspace }}/Hoshino-src
        run: |
          set -euo pipefail
          make smoke

      - name: Verify Xcode resolves the exact iOS 16.5 SDK
        working-directory: ${{ github.workspace }}/Hoshino-src
        run: |
          set -euo pipefail
          BUILD_SETTINGS="$(xcodebuild \
            -project Hoshino.xcodeproj \
            -scheme Hoshino \
            -configuration Release \
            -sdk "$IOS_SDK_PATH" \
            -showBuildSettings)"
          printf '%s\n' "$BUILD_SETTINGS" | grep -F "SDKROOT = $IOS_SDK_PATH"

      - name: Build and package IPA with iOS 16.5 SDK
        working-directory: ${{ github.workspace }}/Hoshino-src
        run: |
          set -euo pipefail
          make clean
          make ipa \
            SDK="$IOS_SDK_PATH" \
            IPA_NAME="$IPA_NAME" \
            ENTITLEMENTS="Hoshino/Entitlements/TrollStore.entitlements"

          IPA_PATH="$SOURCE_DIR/build/$IPA_NAME.ipa"
          test -s "$IPA_PATH"
          unzip -tq "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload Hoshino IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hoshino-iOS16.5-${{ github.sha }}
          path: ${{ github.workspace }}/Hoshino-src/build/Hoshino-iOS16.5.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
