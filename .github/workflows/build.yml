name: Build TrollStore TAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Install deps
        run: |
          brew install libarchive openssl@3 pkg-config || true
          brew install ldid || true
          if ! command -v ldid >/dev/null 2>&1; then
            if [ -f "$THEOS/bin/ldid" ]; then
              sudo ln -sf "$THEOS/bin/ldid" /usr/local/bin/ldid
            fi
          fi
          which ldid || true
          ldid -v || true

      - name: Build libarchive for iOS arm64
        run: |
          cd /tmp
          curl -L -o libarchive.tar.gz https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz
          tar xzf libarchive.tar.gz
          cd libarchive-3.7.4
          SDK=$THEOS/sdks/iPhoneOS16.5.sdk
          ./configure \
            --host=arm64-apple-darwin \
            --disable-shared \
            --enable-static \
            --without-bz2lib \
            --without-lzma \
            --without-lzo2 \
            --without-lz4 \
            --without-zstd \
            --without-nettle \
            --without-openssl \
            --without-xml2 \
            --without-expat \
            --without-iconv \
            CC="$(xcrun --sdk macosx --find clang)" \
            CFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=14.0 -O2 -Wno-everything" \
            CPPFLAGS="-isysroot $SDK" \
            LDFLAGS="-arch arm64 -isysroot $SDK"
          make -j$(sysctl -n hw.ncpu)
          echo "=== libarchive.a ==="
          ls -la .libs/libarchive.a || ls -la libarchive.a
          cp .libs/libarchive.a /tmp/libarchive_ios.a 2>/dev/null || cp libarchive.a /tmp/libarchive_ios.a
          lipo -info /tmp/libarchive_ios.a || file /tmp/libarchive_ios.a

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root
          find "$GITHUB_WORKSPACE/build_root" -maxdepth 4 -not -path "*__MACOSX*"

      - name: Prepare Project
        run: |
          mkdir -p project/Resources
          ROOT="$GITHUB_WORKSPACE/build_root"

          CS=$(find "$ROOT" -name "CodeSigningInstaller.swift" | head -n 1)
          AM=$(find "$ROOT" -name "AppManager.swift" | head -n 1)
          SV=$(find "$ROOT" -name "SettingsView.swift" | head -n 1)
          AL=$(find "$ROOT" -name "AppListView.swift" | head -n 1)
          MTB=$(find "$ROOT" -name "MainTabBarController.swift" | head -n 1)
          TSA=$(find "$ROOT" -name "TrollStoreApp.swift" | head -n 1)
          RES=$(find "$ROOT" -type d -name "Resources" -not -path "*__MACOSX*" | head -n 1)
          LDID=$(find "$ROOT" -type f -name "ldid" ! -name "*.*" | head -n 1)
          TH=$(find "$ROOT" -type f -name "trollstorehelper" ! -name "*.*" | head -n 1)
          TSH=$(find "$ROOT" -type f -name "TrollHelper" ! -name "*.*" | head -n 1)

          [ -n "$CS" ] && cp "$CS" project/
          [ -n "$AM" ] && cp "$AM" project/
          [ -n "$SV" ] && cp "$SV" project/
          [ -n "$AL" ] && cp "$AL" project/
          [ -n "$MTB" ] && cp "$MTB" project/
          [ -n "$TSA" ] && cp "$TSA" project/
          [ -n "$RES" ] && cp -r "$RES"/* project/Resources/
          [ -n "$LDID" ] && cp "$LDID" project/ldid
          [ -n "$TH" ] && cp "$TH" project/trollstorehelper
          [ -n "$TSH" ] && cp "$TSH" project/TrollHelper

          chmod 755 project/ldid project/trollstorehelper project/TrollHelper 2>/dev/null || true

          cp /tmp/libarchive_ios.a project/libarchive.a
          ls -la project

      - name: Create Makefile
        run: |
          cat << 'EOF' > project/Makefile
          ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESS = TrollStore
          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = TrollStore
          TrollStore_FILES = CodeSigningInstaller.swift AppManager.swift SettingsView.swift AppListView.swift MainTabBarController.swift TrollStoreApp.swift
          TrollStore_FRAMEWORKS = UIKit SwiftUI Foundation CoreGraphics Security
          TrollStore_CFLAGS = -Wno-error -Wno-everything
          TrollStore_OBJCFLAGS = -Wno-error -Wno-everything
          TrollStore_LDFLAGS = libarchive.a -lz
          TrollStore_RESOURCE_DIRS = Resources
          TrollStore_SWIFTFLAGS = -parse-as-library
          include $(THEOS_MAKE_PATH)/application.mk
          EOF

      - name: Strip Scene Manifest
        run: |
          PLIST=project/Resources/Info.plist
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -n 60
          fi

      - name: Build App
        run: |
          cd project
          ls -la
          make -j$(sysctl -n hw.ncpu)

      - name: Package TAR
        run: |
          cd project
          APP_PATH=$(find .theos -name "TrollStore.app" -type d | grep -v "_" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "TrollStore.app not found"
            find .theos -type d
            exit 1
          fi
          cp trollstorehelper "$APP_PATH/trollstorehelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/trollstorehelper" 2>/dev/null || true
          cp ldid "$APP_PATH/ldid" 2>/dev/null || true
          cp TrollHelper "$APP_PATH/TrollHelper" 2>/dev/null || true
          chmod 755 "$APP_PATH/ldid" "$APP_PATH/TrollHelper" 2>/dev/null || true
          rm -f "$APP_PATH/entitlements.plist"
          tar -cvf ../TrollStore.tar -C $(dirname "$APP_PATH") TrollStore.app

      - name: Upload TAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.tar
          path: TrollStore.tar
          if-no-files-found: warn
