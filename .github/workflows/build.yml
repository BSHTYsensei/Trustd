name: Build TrollStore Components

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid dpkg xz

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install iPhoneOS16.5 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        curl -L -o iPhoneOS16.5.sdk.tar.xz \
          https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz
        rm iPhoneOS16.5.sdk.tar.xz
        ls -la

    - name: Build RootHelper (trollstorehelper)
      run: |
        make -C ./RootHelper FINALPACKAGE=1

    - name: Build TrollHelper
      run: |
        make -C ./TrollHelper FINALPACKAGE=1

    - name: Sign with fastPathSign
      run: |
        FASTPATHSIGN=$(find . -name 'fastPathSign' -type f | head -n 1)
        echo "Using fastPathSign at: $FASTPATHSIGN"
        chmod +x "$FASTPATHSIGN"
        "$FASTPATHSIGN" RootHelper/.theos/obj/trollstorehelper || true
        "$FASTPATHSIGN" TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trollstore-binaries
        path: |
          RootHelper/.theos/obj/trollstorehelper
          TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/
