name: Build Santander IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santander-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify selected Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          ACTUAL_XCODE="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          if [[ "$ACTUAL_XCODE" != "16.4" ]]; then
            echo "::error::Expected Xcode 16.4, but selected $ACTUAL_XCODE"
            exit 1
          fi
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          curl -fL --retry 3 --retry-delay 2 "$SDK_URL" -o iPhoneOS16.5.sdk.tar.xz
          tar -xJf iPhoneOS16.5.sdk.tar.xz
          test -d iPhoneOS16.5.sdk
          rm -rf "${GITHUB_WORKSPACE}/sdk"
          mv iPhoneOS16.5.sdk "${GITHUB_WORKSPACE}/sdk"
          test -d "${GITHUB_WORKSPACE}/sdk/System/Library/Frameworks"
          echo "SDKROOT=${GITHUB_WORKSPACE}/sdk" >> "$GITHUB_ENV"

      - name: Extract Santander source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q Santander-main.zip -d source
          rm -rf source/__MACOSX

          SOURCE_DIR="$(find source -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [[ -z "$SOURCE_DIR" || ! -f "$SOURCE_DIR/Makefile" ]]; then
            echo "::error::Could not locate Santander source directory containing Makefile."
            find source -maxdepth 3 -print
            exit 1
          fi

          echo "SOURCE_DIR=${GITHUB_WORKSPACE}/${SOURCE_DIR}" >> "$GITHUB_ENV"
          echo "Using source directory: $SOURCE_DIR"

      - name: Download ArgumentParser 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          curl -fL --retry 3 \
            https://github.com/apple/swift-argument-parser/archive/refs/tags/1.0.3.tar.gz \
            -o ap.tar.gz
          tar -xzf ap.tar.gz
          test -d swift-argument-parser-1.0.3/Sources/ArgumentParser
          test -d swift-argument-parser-1.0.3/Sources/ArgumentParserToolInfo

      - name: Build ArgumentParser for iOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          AP_DIR_ABS="$PWD/build/ArgumentParser"
          AP_ROOT="$PWD/swift-argument-parser-1.0.3/Sources"
          mkdir -p "$AP_DIR_ABS"

          TOOLINFO_FILES=()
          while IFS= read -r -d '' file; do TOOLINFO_FILES+=("$file"); done < <(find "$AP_ROOT/ArgumentParserToolInfo" -type f -name '*.swift' -print0)
          if [[ ${#TOOLINFO_FILES[@]} -eq 0 ]]; then
            echo "::error::No ArgumentParserToolInfo Swift sources found."
            exit 1
          fi

          echo "Building ArgumentParserToolInfo (${#TOOLINFO_FILES[@]} files)"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$SDKROOT" \
            -emit-module -emit-library -static \
            -module-name ArgumentParserToolInfo \
            -swift-version 5 -O \
            "${TOOLINFO_FILES[@]}" \
            -emit-module-path "$AP_DIR_ABS/ArgumentParserToolInfo.swiftmodule" \
            -o "$AP_DIR_ABS/libArgumentParserToolInfo.a"

          ARGUMENTPARSER_FILES=()
          while IFS= read -r -d '' file; do ARGUMENTPARSER_FILES+=("$file"); done < <(find "$AP_ROOT/ArgumentParser" -type f -name '*.swift' -print0)
          if [[ ${#ARGUMENTPARSER_FILES[@]} -eq 0 ]]; then
            echo "::error::No ArgumentParser Swift sources found."
            exit 1
          fi

          echo "Building ArgumentParser (${#ARGUMENTPARSER_FILES[@]} files)"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$SDKROOT" \
            -emit-module -emit-library -static \
            -module-name ArgumentParser \
            -swift-version 5 -O \
            -I "$AP_DIR_ABS" \
            "${ARGUMENTPARSER_FILES[@]}" \
            -emit-module-path "$AP_DIR_ABS/ArgumentParser.swiftmodule" \
            -o "$AP_DIR_ABS/libArgumentParser.a"

          test -s "$AP_DIR_ABS/ArgumentParser.swiftmodule"
          test -s "$AP_DIR_ABS/ArgumentParserToolInfo.swiftmodule"
          test -s "$AP_DIR_ABS/libArgumentParser.a"
          test -s "$AP_DIR_ABS/libArgumentParserToolInfo.a"
          ls -lah "$AP_DIR_ABS"

      # Makefile normally clones SwiftTerm 1.2.1. Clone and patch it here first,
      # then create the marker Makefile checks so it does not replace the patched source.
      - name: Prepare SwiftTerm 1.2.1 Xcode 16.4 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          SWIFTTERM_DIR="vendor/SwiftTerm"
          TEXT_INPUT="$SWIFTTERM_DIR/Sources/SwiftTerm/iOS/iOSTextInput.swift"
          SWIFTTERM_MARKER="$SWIFTTERM_DIR/.santander-cloned"

          rm -rf "$SWIFTTERM_DIR"
          mkdir -p vendor
          git clone --depth 1 --single-branch --branch 1.2.1 \
            https://github.com/migueldeicaza/SwiftTerm.git "$SWIFTTERM_DIR"

          test -f "$TEXT_INPUT"

          # Logger.critical(_:) uses OSLogMessage's compiler-special interpolation.
          # This SDK/toolchain combination rejects those calls from this source file.
          # NSLog accepts a normal Foundation String, preserving the diagnostic text
          # without invoking the OSLog interpolation type-checking path.
          python3 - "$TEXT_INPUT" <<'PYTHON'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          replacements = {
              r'log.critical("Attempt to access [\(r._start)..<\(r.end) on a string with \(self.textInputStorage.count)")':
              r'NSLog("Attempt to access [\(r._start)..<\(r.end) on a string with \(self.textInputStorage.count)")',
              r'log.critical("xTextPosition created with start=\(start), resetting to 0")':
              r'NSLog("xTextPosition created with start=\(start), resetting to 0")',
              r'log.critical("xTextRange created with end=\(end) < start=\(start), resetting")':
              r'NSLog("xTextRange created with end=\(end) < start=\(start), resetting")',
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
                  print(f"Patched: {old.split(chr(34))[1]}")
              elif new in source:
                  print(f"Already patched: {new.split(chr(34))[1]}")
              else:
                  raise SystemExit(f"Expected SwiftTerm 1.2.1 log statement not found: {old}")

          if "log.critical(" in source:
              raise SystemExit("One or more Logger.critical calls remain in iOSTextInput.swift")
          if source.count("NSLog(") < 3:
              raise SystemExit("Expected all 3 diagnostic statements to use NSLog")

          # The previous workflow trial added this unnecessary import. A clean clone
          # should not need it after moving these messages to Foundation NSLog.
          source = source.replace("import CoreGraphics\nimport os\n", "import CoreGraphics\n", 1)
          path.write_text(source, encoding="utf-8")
          print("Validated all 3 SwiftTerm diagnostics now use Foundation NSLog")
          PYTHON

          echo "--- Patched SwiftTerm diagnostics ---"
          grep -n 'NSLog(' "$TEXT_INPUT"
          if grep -n 'log\.critical(' "$TEXT_INPUT"; then
            echo "::error::SwiftTerm OSLog interpolation calls remain after patch"
            exit 1
          fi

          # This marker is the Makefile's dependency target; do not omit it.
          touch "$SWIFTTERM_MARKER"
          test -f "$SWIFTTERM_MARKER"
          git -C "$SWIFTTERM_DIR" rev-parse --short HEAD

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          test -s build/ArgumentParser/ArgumentParser.swiftmodule
          test -s build/ArgumentParser/ArgumentParserToolInfo.swiftmodule
          test -s build/ArgumentParser/libArgumentParser.a
          test -s build/ArgumentParser/libArgumentParserToolInfo.a
          test -f vendor/SwiftTerm/.santander-cloned

          mkdir -p logs
          BUILD_LOG="logs/Santander-build-$(date +%Y%m%d-%H%M%S).log"
          set -o pipefail
          make ipa 2>&1 | tee "$BUILD_LOG"

          test -s build/AppSantander.ipa
          echo "IPA built: ${SOURCE_DIR}/build/AppSantander.ipa"

      - name: Automatic CI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          make test TEST_BACKEND=ci

      - name: Upload test logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Santander-test-logs
          path: source/Santander-main/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Santander-IPA
          path: source/Santander-main/build/AppSantander.ipa
          if-no-files-found: error
          retention-days: 7
