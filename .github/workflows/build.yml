name: Hoshino TrollStore TIPA

on:
  push:
    paths:
      - "Hoshino.zip"
      - ".github/workflows/Hoshino-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoshino-tipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tipa:
    name: Build TrollStore TIPA only
    # Hoshino's Makefile requires iPhoneOS SDK 27.1 or newer.
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract Hoshino.zip
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/Hoshino.zip"
          test -f "$archive" || {
            echo "::error::Hoshino.zip must be in the repository root."
            exit 1
          }
          unzip -t "$archive"

          temp_dir="$RUNNER_TEMP/hoshino-source"
          rm -rf "$temp_dir"
          mkdir -p "$temp_dir"
          unzip -q "$archive" -d "$temp_dir"

          source_root="$temp_dir/Hoshino"
          test -f "$source_root/Makefile" || {
            echo "::error::Hoshino.zip must contain Hoshino/Makefile."
            find "$temp_dir" -maxdepth 3 -print
            exit 1
          }
          test -d "$source_root/Fila.xcodeproj" || {
            echo "::error::Fila.xcodeproj was not found in the Hoshino source."
            exit 1
          }

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='Hoshino.zip' \
            "$source_root/" "$GITHUB_WORKSPACE/"

          test -f "$GITHUB_WORKSPACE/Makefile"
          echo "Source extracted to repository root."

      - name: Select Xcode and verify required iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          if [[ "$(printf '%s\n' 27.1 "$sdk_version" | sort -V | head -n1)" != "27.1" ]]; then
            echo "::error::Hoshino requires iPhoneOS SDK 27.1 or newer; found $sdk_version."
            exit 1
          fi

      - name: Run host-side test harness
        shell: bash
        run: |
          set -euo pipefail
          make harness

      - name: Compile and package TIPA only
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/hoshino-derived
        run: |
          set -euo pipefail
          # The Makefile's tipa target builds the full Hoshino composition
          # and invokes package-ipa.sh in TrollStore (tipa) mode.
          # It does not build .deb or .ipa packages.
          make tipa DERIVED_DATA="$DERIVED_DATA"

      - name: Verify TIPA output and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tipas=(build/Packages/*.tipa)
          if (( ${#tipas[@]} != 1 )); then
            echo "::error::Expected exactly one .tipa, found ${#tipas[@]}."
            find build/Packages -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          file="${tipas[0]}"
          unzip -t "$file"
          shasum -a 256 "$file" > build/Packages/SHA256SUMS
          cat build/Packages/SHA256SUMS

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoshino-TrollStore-${{ github.sha }}
          path: |
            build/Packages/*.tipa
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
