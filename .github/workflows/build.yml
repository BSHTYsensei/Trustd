name: Build TrollStore with Theos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and SDK locally
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Extract TrollStore.zip
        run: |
          unzip -o TrollStore.zip -d build_root

      - name: Prepare Project
        run: |
          mkdir -p project/Resources
          cp build_root/TrollStore/CodeSigningInstaller.swift project/
          cp build_root/TrollStore/AppListView.swift project/
          cp build_root/TrollStore/SettingsView.swift project/
          cp build_root/TrollStore/AppManager.swift project/
          cp build_root/TrollStore/Resources/* project/Resources/
          cp build_root/TrollStore/ldid project/
          cp build_root/TrollStore/trollstorehelper project/
          cp build_root/TrollStore/TrollHelper project/ || true

      - name: Fix Swift WIFEXITED/WEXITSTATUS macros
        run: |
          python3 -c "
          patch = '''import Darwin
          func WIFEXITED(_ status: Int32) -> Bool { return (status & 0x7f) == 0 }
          func WEXITSTATUS(_ status: Int32) -> Int32 { return (status >> 8) & 0xff }
          '''
          import glob
          for f in glob.glob('project/*.swift'):
              with open(f, 'r') as file:
                  content = file.read()
              if 'WIFEXITED' in content and 'func WIFEXITED' not in content:
                  with open(f, 'w') as file:
                      file.write(patch + content)
          "

      - name: Create Makefile and Entry Point
        run: |
          python3 -c "
          makefile_content = '''ARCHS = arm64
          TARGET = iphone:clang:16.5:15.0
          INSTALL_TARGET_PROCESS = TrollStore
          include \$(THEOS)/makefiles/common.mk
          APPLICATION_NAME = TrollStore
          TrollStore_FILES = TrollStoreApp.swift CodeSigningInstaller.swift AppListView.swift SettingsView.swift AppManager.swift
          TrollStore_FRAMEWORKS = UIKit SwiftUI Foundation CoreGraphics
          TrollStore_SWIFTFLAGS = -target arm64-apple-ios15.0
          TrollStore_RESOURCE_DIRS = Resources
          include \$(THEOS_MAKE_PATH)/application.mk

          after-stage::
          \tcp ldid \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/
          \tcp trollstorehelper \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/
          \tcp TrollHelper \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ || true
          \tchmod 755 \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid
          \tchmod 755 \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/trollstorehelper
          \tchmod 755 \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/TrollHelper || true
          \t\$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid -Sentitlements.plist \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/TrollStore
          \t\$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid -Sentitlements.plist \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/trollstorehelper
          \t\$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid -Sentitlements.plist \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid
          \t\$(THEOS_STAGING_DIR)/Applications/TrollStore.app/ldid -Sentitlements.plist \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/TrollHelper || true
          \trm -f \$(THEOS_STAGING_DIR)/Applications/TrollStore.app/entitlements.plist
          '''
          with open('project/Makefile', 'w') as f:
              f.write(makefile_content.replace('    ', '\t'))
          
          entry_code = '''import UIKit
          import SwiftUI

          @main
          class TrollStoreAppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let appListVC = AppListViewController()
                  let appListNav = UINavigationController(rootViewController: appListVC)
                  appListNav.tabBarItem = UITabBarItem(title: NSLocalizedString(\"Apps\", comment: \"\"), image: UIImage(systemName: \"app\"), tag: 0)
                  
                  let settingsVC = UIHostingController(rootView: SettingsView())
                  settingsVC.title = NSLocalizedString(\"Settings\", comment: \"\")
                  let settingsNav = UINavigationController(rootViewController: settingsVC)
                  settingsNav.tabBarItem = UITabBarItem(title: NSLocalizedString(\"Settings\", comment: \"\"), image: UIImage(systemName: \"gear\"), tag: 1)
                  
                  let tabBarController = UITabBarController()
                  tabBarController.viewControllers = [appListNav, settingsNav]
                  window?.rootViewController = tabBarController
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          '''
          with open('project/TrollStoreApp.swift', 'w') as f:
              f.write(entry_code)
          "

      - name: Build with Theos
        run: |
          cd project
          make

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r project/.theos/obj/TrollStore.app Payload/TrollStore.app
          zip -r9 TrollStore.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore.ipa
          path: TrollStore.ipa
