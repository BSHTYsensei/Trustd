name: Build TrollStore Components

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Install dependencies
      run: |
        brew install ldid dpkg xz

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install iPhoneOS16.5 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        curl -L -o iPhoneOS16.5.sdk.tar.xz \
          https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz
        rm iPhoneOS16.5.sdk.tar.xz
        ls -la

    - name: Clone TrollStore source
      run: |
        git clone --recursive https://github.com/opa334/TrollStore.git trollstore
        ls -la trollstore

    - name: Build RootHelper (trollstorehelper)
      working-directory: trollstore/RootHelper
      run: |
        make FINALPACKAGE=1

    - name: Build TrollHelper
      working-directory: trollstore/TrollHelper
      run: |
        make FINALPACKAGE=1

    - name: Sign with fastPathSign
      working-directory: trollstore
      run: |
        chmod +x fastPathSign/fastPathSign
        ./fastPathSign/fastPathSign RootHelper/.theos/obj/trollstorehelper || true
        ./fastPathSign/fastPathSign TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trollstore-binaries
        path: |
          trollstore/RootHelper/.theos/obj/trollstorehelper
          trollstore/TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/
