name: Build TrollStore Components

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Install dependencies
      run: |
        brew install ldid dpkg xz libarchive pkg-config

    - name: Verify libarchive
      run: |
        echo "libarchive prefix: $(brew --prefix libarchive)"
        ls -la "$(brew --prefix libarchive)/include/archive.h"

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install iPhoneOS16.5 SDK
      run: |
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        curl -L -o iPhoneOS16.5.sdk.tar.xz \
          https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS16.5.sdk.tar.xz
        rm iPhoneOS16.5.sdk.tar.xz
        ls -la

    - name: Clone TrollStore source
      run: |
        git clone --recursive https://github.com/opa334/TrollStore.git trollstore

    - name: Build fastPathSign (tool, needed by RootHelper signing)
      working-directory: trollstore/Exploits/fastPathSign
      run: make

    - name: Build trollstorehelper
      working-directory: trollstore/RootHelper
      run: make FINALPACKAGE=1

    - name: Build TrollHelper
      working-directory: trollstore/TrollHelper
      run: make FINALPACKAGE=1

    - name: Locate binaries
      working-directory: trollstore
      run: |
        echo "=== trollstorehelper ==="
        find . -name 'trollstorehelper' -type f
        echo "=== TrollHelper binary ==="
        find . -path '*TrollHelper*' -type f -perm +111

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: trollstore-binaries
        path: |
          trollstore/**/trollstorehelper
          trollstore/**/TrollHelper
        if-no-files-found: warn
